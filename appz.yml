app:
    name: OpenProject
    code: OPENPROJECT 
    notify: appzdev@cloudbourne.co

build:
    version: 12.3
    env: PROD
    build_file: none
    output_files: output/*.zip
    image_template: openproject-12.3

deploy:
    context: ecloudcontrol/PROD
    type: statefulset
    replicas: 1
    #ingress: none
    port:
    - 80
    - 9102
    - 30167
volumes:
- claim: openproject-assets
  mount: /appz/data/openproject  
  name: assets
  size: 5Gi
- claim: openproject-backup
  mount: /appz/backup 
  name: backup
  size: 5Gi

properties:
    ATTACHMENTS_STORAGE_PATH: /appz/data/openproject

    SECRET_KEY_BASE: 
      vault: SECRET_KEY_BASE
    POSTGRES_HOST: openproject-postgres-13-x
    POSTGRES_PORT: 5432
    POSTGRES_DB: openproject
    POSTGRES_USER: openproject
    POSTGRES_PASSWORD: 
      vault: POSTGRESQL_OPENPROJECT_PASSWORD
    ENABLE_BACKUP_METRIC: 1
    revision: 39
